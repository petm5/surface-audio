{
  node.description = "Surface Pro 9 Speaker"
  filter.graph = {
    nodes = [
      {
        type = sofa
        label = spatializer
        name = spFL
        config = {
          filename = "/usr/share/surface-audio/sofa/dtf.sofa"
          blocksize = 64
        }
        control = {
          "Azimuth" = 75.0
          "Elevation" = 62.0
          "Radius" = 45.0
        }
      }
      {
        type = sofa
        label = spatializer
        name = spFR
        config = {
          filename = "/usr/share/surface-audio/sofa/dtf.sofa"
          blocksize = 64
        }
        control = {
          "Azimuth" = 285.0
          "Elevation" = 62.0
          "Radius" = 45.0
        }
      }
      {
        type = builtin
        label = mixer
        name = mixL
        control = { "Gain 1" = 0.6 "Gain 2" = -0.3 }
      }
      {
        type = builtin
        label = mixer
        name = mixR
        control = { "Gain 1" = -0.3 "Gain 2" = 0.6 }
      }
      {
        type = "lv2"
        plugin = "https://chadmed.au/bankstown"
        name = "bankstown"
        control = {
            bypass = 0
            amt = 1.8
            sat_third = 3.1
            blend = 1
            ceil = 120.0
            floor = 20.0
            final_hp = 120.0
        }
      }
      {
          type = "lv2"
          plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_mono"
          name = "ell"
          control = {
              enabled = 1
              input = 1.0
              fft = 2
          }
      }
      {
          type = "lv2"
          plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_mono"
          name = "elr"
          control = {
              enabled = 1
              input = 1.0
              fft = 2
          }
      }
      {
        type = "builtin"
        name = "eq"
        label = "param_eq"
        config = {
          filename = "/usr/share/surface-audio/sp9/param_eq.conf"
        }
      }
      {
          type = "lv2"
          plugin = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
          name = "bp"
          control = {
              mode = 0
              ce_0 = 1
              sla_0 = 5.0
              cr_0 = 2.95
              al_0 = 0.925
              at_0 = 1.0
              rt_0 = 100
              kn_0 = 0.125
              cbe_1 = 1
              sf_1 = 380.0
              ce_1 = 0
              cbe_2 = 0
              ce_2 = 0
              cbe_3 = 0
              ce_3 = 0
              cbe_4 = 0
              ce_4 = 0
              cbe_5 = 0
              ce_5 = 0
              cbe_6 = 0
              ce_6 = 0
          }
      }
      {
          type = "lv2"
          plugin = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
          name = "lim"
          control = {
              sla = 5.0
              al = 1.0
              at = 1.0
              rt = 100.0
              cr = 15.0
              cm = 0
              kn = 0.5
          }
      }
    ]
    links = [
      {
        output = "spFL:Out L"
        input = "mixL:In 1"
      }
      {
        output = "spFL:Out R"
        input = "mixR:In 1"
      }
      {
        output = "spFR:Out L"
        input = "mixL:In 2"
      }
      {
        output = "spFR:Out R"
        input = "mixR:In 2"
      }
      {
        output = "mixL:Out"
        input = "bankstown:in_l"
      }
      {
        output = "mixR:Out"
        input = "bankstown:in_r"
      }
      {
        output = "bankstown:out_l"
        input = "ell:in"
      }
      {
        output = "bankstown:out_r"
        input = "elr:in"
      }
      {
        output = "ell:out"
        input = "eq:In 1"
      }
      {
        output = "elr:out"
        input = "eq:In 2"
      }
      {
        output = "eq:Out 1"
        input = "bp:in_l"
      }
      {
        output = "eq:Out 2"
        input = "bp:in_r"
      }
      {
        output = "bp:out_l"
        input = "lim:in_l"
      }
      {
        output = "bp:out_r"
        input = "lim:in_r"
      }
    ]
    inputs = [ "spFL:In" "spFR:In" ]
    outputs = [ "lim:out_l" "lim:out_r" ]
    capture.volumes = [
        {
            control = "ell:volume"
            min = -52.0
            max = 0.0
            scale = "cubic"
        }
        {
            control = "elr:volume"
            min = -52.0
            max = 0.0
            scale = "cubic"
        }
    ]
  }
  capture.props = {
    node.name = "audio_effect.sp9-convolver"
    media.class = "Audio/Sink"
    node.virtual = false
    priority.session = 10000
    device.api = "dsp"
    audio.channels = 2
    audio.position = ["FL", "FR"]
    state.default-channel-volume = 0.343
  }
  playback.props = {
    node.name = "effect_output.sp9-convolver"
    target.object = "alsa_output.pci-0000_00_1f.3.analog-stereo"
    node.passive = true
    audio.channels = 2
    audio.position = ["FL", "FR"]
  }
}
