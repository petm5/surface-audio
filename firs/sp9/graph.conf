{
  node.description = "Surface Pro 9 Speaker"
  filter.graph = {
    nodes = [
      {
        type = "lv2"
        plugin = "https://chadmed.au/bankstown"
        name = "bankstown"
        control = {
            bypass = 0
            amt = 1.8
            sat_third = 2.2
            blend = 1
            ceil = 180.0
            floor = 20.0
            final_hp = 180.0
        }
      }
      {
          type = "lv2"
          plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_mono"
          name = "ell"
          control = {
              enabled = 1
              input = 1.0
              fft = 2
          }
      }
      {
          type = "lv2"
          plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_mono"
          name = "elr"
          control = {
              enabled = 1
              input = 1.0
              fft = 2
          }
      }
      {
        type = "builtin"
        name = "eqL"
        label = "param_eq"
        config = {
          filename = "/usr/share/surface-audio/sp9/param_eq_l.txt"
          gain = 1.0
        }
      }
      {
        type = "builtin"
        name = "eqR"
        label = "param_eq"
        config = {
          filename = "/usr/share/surface-audio/sp9/param_eq_r.txt"
          gain = 1.0
        }
      }
      {
          type = "lv2"
          plugin = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
          name = "bp"
          control = {
              mode = 0
              ce_0 = 1
              sla_0 = 5.0
              cr_0 = 1.80
              al_0 = 0.707
              at_0 = 1.0
              rt_0 = 100.0
              kn_0 = 0.125
              cbe_1 = 1
              sf_1 = 200.0
              ce_1 = 1
              sla_1 = 5.0
              cr_1 = 5.50
              al_1 = 0.400
              at_1 = 1.0
              rt_1 = 100.0
              kn_1 = 0.125
              cbe_2 = 1
              sf_2 = 1600.0
              ce_2 = 1
              sla_2 = 5.0
              cr_2 = 1.80
              al_2 = 0.850
              at_2 = 1.0
              rt_2 = 100.0
              kn_2 = 0.250
              cbe_3 = 1
              sf_3 = 8000.0
              ce_3 = 1
              cr_3 = 1.80
              al_3 = 0.707
              at_3 = 1.0
              rt_3 = 100.0
              kn_3 = 0.250
              cbe_4 = 0
              ce_4 = 0
              cbe_5 = 0
              ce_5 = 0
              cbe_6 = 0
              ce_6 = 0
          }
      }
      {
          type = "lv2"
          plugin = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
          name = "lim"
          control = {
              sla = 5.0
              al = 1.0
              at = 1.0
              rt = 100.0
              cr = 25.0
              kn = 0.5
          }
      }
    ]
    links = [
      {
        output = "bankstown:out_l"
        input = "ell:in"
      }
      {
        output = "bankstown:out_r"
        input = "elr:in"
      }
      {
        output = "ell:out"
        input = "eqL:In 1"
      }
      {
        output = "elr:out"
        input = "eqR:In 1"
      }
      {
        output = "eqL:Out 1"
        input = "bp:in_l"
      }
      {
        output = "eqR:Out 1"
        input = "bp:in_r"
      }
      {
        output = "bp:out_l"
        input = "lim:in_l"
      }
      {
        output = "bp:out_r"
        input = "lim:in_r"
      }
    ]
    inputs = [ "bankstown:in_l" "bankstown:in_r" ]
    outputs = [ "lim:out_l" "lim:out_r" ]
    capture.volumes = [
        {
            control = "ell:volume"
            min = -45.0
            max = 18.0
            scale = "cubic"
        }
        {
            control = "elr:volume"
            min = -45.0
            max = 18.0
            scale = "cubic"
        }
    ]
  }
  capture.props = {
    node.name = "audio_effect.sp9-convolver"
    media.class = "Audio/Sink"
    node.virtual = false
    priority.session = 10000
    device.api = "dsp"
    audio.channels = 2
    audio.position = ["FL", "FR"]
    state.default-channel-volume = 0.343
  }
  playback.props = {
    node.name = "effect_output.sp9-convolver"
    target.object = "alsa_output.pci-0000_00_1f.3.analog-stereo"
    node.passive = true
    audio.channels = 2
    audio.position = ["FL", "FR"]
  }
}
